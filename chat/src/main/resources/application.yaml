spring:
  application:
    name: chat
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chat}
    username: ${DB_USER:oneleft}
    password: ${DB_PASSWORD:oneleft-dev}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that it matches
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USER:oneleft}
    password: ${RABBITMQ_PASSWORD:oneleft-dev}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Token issuer (Keycloak realm). The public keys are downloaded from its JWKS.
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/oneleft}
          # Inside Docker the keys are downloaded through the internal network (keycloak:8180),
          # but the token issuer is still the public URL (localhost:8180)
          jwk-set-uri: ${KEYCLOAK_JWKS:${KEYCLOAK_ISSUER:http://localhost:8180/realms/oneleft}/protocol/openid-connect/certs}

server:
  # Behind the gateway: generated URLs use the public host from X-Forwarded-*
  forward-headers-strategy: framework
  port: ${PORT:8084}

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Histograms to compute latency percentiles (p95, p99) in Prometheus
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: OneLeft · chat

oneleft:
  # Who is in a plan, its state and when it ends: asked to the plans service with the token of whoever opens the chat
  plans:
    url: ${PLANS_URL:http://localhost:8082}
  chat:
    # The messages of a plan are deleted this long after it ends (HU-008)
    retention: ${CHAT_RETENTION:PT24H}
