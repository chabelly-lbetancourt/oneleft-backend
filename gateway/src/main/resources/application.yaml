spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: users
              uri: ${USERS_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/users/**
            - id: plans
              uri: ${PLANS_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/plans/**

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
