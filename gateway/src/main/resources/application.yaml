spring:
  application:
    name: gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          # Emisor de los tokens (realm de Keycloak). Las claves públicas se descargan de su JWKS.
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/oneleft}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: users
              uri: ${USERS_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/users/**
            - id: plans
              uri: ${PLANS_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/plans/**

server:
  port: ${PORT:8080}

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Histogramas para calcular percentiles de latencia (p95, p99) en Prometheus
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true

oneleft:
  cors:
    # App web en desarrollo y app Android con Capacitor (https://localhost y capacitor://localhost)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://localhost,capacitor://localhost}
