name: ci

on:
  push:
    branches: [main, dev, 'issue#*', 'hotfix/**']
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build, tests y cobertura
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # SonarQube necesita el historial para calcular el código nuevo

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar, ejecutar tests y comprobar cobertura (≥ 80 %)
        run: ./mvnw -B verify

      - name: Resumen de cobertura
        if: always()
        run: |
          echo "## Cobertura de líneas (JaCoCo)" >> "$GITHUB_STEP_SUMMARY"
          echo "| Módulo | Líneas cubiertas | Total | Cobertura |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for csv in */target/site/jacoco/jacoco.csv; do
            [ -f "$csv" ] || continue
            module="${csv%%/*}"
            awk -F, -v m="$module" 'NR>1 {missed+=$8; covered+=$9}
              END {total=missed+covered; pct=(total>0)?sprintf("%.1f %%",100*covered/total):"sin código";
                   printf "| %s | %d | %d | %s |\n", m, covered, total, pct}' "$csv" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Guardar informes de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco
          path: '*/target/site/jacoco/'
          if-no-files-found: ignore

      - name: Análisis en SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        run: ./mvnw -B sonar:sonar

      - name: Aviso si falta SonarQube Cloud
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN no configurado; se omite el análisis de SonarQube Cloud."

  docker:
    name: Imagen Docker · ${{ matrix.service }}
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [gateway, users, plans]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Empaquetar ${{ matrix.service }}
        run: ./mvnw -B -pl ${{ matrix.service }} -am -DskipTests package

      - uses: docker/setup-buildx-action@v4

      - name: Login en GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/oneleft-${{ matrix.service }}
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Construir (y publicar desde main)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
