name: ci

on:
  push:
    # issue#N and hotfix/* branches are validated in their pull request (avoids duplicate runs)
    branches: [main, pre, dev]
  pull_request:
    branches: [dev, pre, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build, tests and coverage
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # SonarQube needs the history to compute new code

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile, run tests and check coverage (>= 80%)
        run: ./mvnw -B verify

      - name: Coverage summary
        if: always()
        run: |
          echo "## Line coverage (JaCoCo)" >> "$GITHUB_STEP_SUMMARY"
          echo "| Module | Covered lines | Total | Coverage |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for csv in */target/site/jacoco/jacoco.csv; do
            [ -f "$csv" ] || continue
            module="${csv%%/*}"
            awk -F, -v m="$module" 'NR>1 {missed+=$8; covered+=$9}
              END {total=missed+covered; pct=(total>0)?sprintf("%.1f %%",100*covered/total):"no code";
                   printf "| %s | %d | %d | %s |\n", m, covered, total, pct}' "$csv" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco
          path: '*/target/site/jacoco/'
          if-no-files-found: ignore

      - name: SonarQube Cloud analysis
        if: env.SONAR_TOKEN != ''
        run: ./mvnw -B sonar:sonar

      - name: Aviso si falta SonarQube Cloud
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN is not set; skipping the SonarQube Cloud analysis."

  docker:
    name: Docker image · ${{ matrix.service }}
    needs: build-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/pre') }}
    strategy:
      matrix:
        service: [gateway, users, plans]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Package ${{ matrix.service }}
        run: ./mvnw -B -pl ${{ matrix.service }} -am -DskipTests package

      - uses: docker/setup-buildx-action@v4

      # Images are published from pre (staging, tag :pre) and main (production, tag :latest)
      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/oneleft-${{ matrix.service }}
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=pre,enable=${{ github.ref == 'refs/heads/pre' }}

      - name: Build (and publish from pre and main)
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ${{ matrix.service }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Result of the CI in the project Slack channel. The webhook URL is a secret (SLACK_WEBHOOK_URL), never in the
  # repository; without it the notification is skipped.
  notify:
    name: Slack notification
    needs: [build-test, docker]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      RESULT: ${{ contains(needs.*.result, 'failure') && 'failure' || (contains(needs.*.result, 'cancelled') && 'cancelled' || 'success') }}
    steps:
      - name: Notify the project channel
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          PUBLISHED: images
        run: |
          case "$RESULT" in
            success) status=":white_check_mark: CI passed" ;;
            failure) status=":x: CI failed" ;;
            *) status=":warning: CI cancelled" ;;
          esac
          if [ "$RESULT" = success ] && [ -n "$PUBLISHED" ] && [ "$BRANCH" != dev ]; then
            status="$status · $PUBLISHED :$([ "$BRANCH" = main ] && echo latest || echo pre)"
          fi
          text=$(printf '%s *%s* · `%s`\n%s (%s)\n<%s|View run>' "$status" "$REPO" "$BRANCH" "${COMMIT%%$'\n'*}" "$ACTOR" "$RUN_URL")
          jq -n --arg text "$text" '{text: $text}' | curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"

      - name: Notice when Slack is not configured
        if: env.SLACK_WEBHOOK_URL == ''
        run: echo "::notice::SLACK_WEBHOOK_URL is not set; skipping the Slack notification."
