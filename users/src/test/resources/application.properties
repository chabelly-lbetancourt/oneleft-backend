# Tests con PostgreSQL real: el driver JDBC de Testcontainers arranca un contenedor efímero
# (compartido por todos los tests del mismo contexto) y Flyway crea el esquema.
spring.datasource.url=jdbc:tc:postgresql:17-alpine:///users
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=test
spring.datasource.password=test
