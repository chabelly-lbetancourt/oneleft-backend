spring:
  application:
    name: users
  security:
    oauth2:
      resourceserver:
        jwt:
          # Emisor de los tokens (realm de Keycloak). Las claves públicas se descargan de su JWKS.
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/oneleft}

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: OneLeft · users
