spring:
  application:
    name: users
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/users}
    username: ${DB_USER:oneleft}
    password: ${DB_PASSWORD:oneleft-dev}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gestiona Flyway; Hibernate solo comprueba que coincide
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          # Emisor de los tokens (realm de Keycloak). Las claves públicas se descargan de su JWKS.
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/oneleft}
          # Dentro de Docker las claves se descargan por la red interna (keycloak:8180),
          # pero el emisor de los tokens sigue siendo la URL pública (localhost:8180)
          jwk-set-uri: ${KEYCLOAK_JWKS:${KEYCLOAK_ISSUER:http://localhost:8180/realms/oneleft}/protocol/openid-connect/certs}

server:
  port: ${PORT:8081}

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Histogramas para calcular percentiles de latencia (p95, p99) en Prometheus
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: OneLeft · users
