# Tests with a real PostgreSQL: the Testcontainers JDBC driver starts a throwaway container
# (shared by every test of the same context) and Flyway creates the schema.
spring.datasource.url=jdbc:tc:postgresql:17-alpine:///notifications
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=test
spring.datasource.password=test

# Tests start without the demo data (the seed tests activate the seed profile themselves)
spring.profiles.default=default
