spring:
  application:
    name: plans
  profiles:
    # Run locally (IntelliJ, ./mvnw spring-boot:run) without choosing a profile, the demo data is loaded on startup.
    # Only applies when no profile is active: the Docker images reset it and the seeders never run with pro (seed & !pro)
    default: seed
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/plans}
    username: ${DB_USER:oneleft}
    password: ${DB_PASSWORD:oneleft-dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  ai:
    model:
      # The language model of HU-010 is off until a key is configured: Compose sets this to «anthropic» and the client
      # to «true» only when ANTHROPIC_API_KEY has a value. Without it the draft of a plan answers «not available» (503)
      chat: none
    chat:
      client:
        enabled: false
    anthropic:
      # Only from the environment, never in the repository
      api-key: ${ANTHROPIC_API_KEY:}
      timeout: PT15S
      max-retries: 1
      chat:
        options:
          model: ${PLAN_DRAFT_MODEL:claude-haiku-5-5}
          max-tokens: 500
          temperature: 0.0
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USER:oneleft}
    password: ${RABBITMQ_PASSWORD:oneleft-dev}
  # Cache of the weather forecasts (HU-026) and of the place suggestions (HU-071)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
  cache:
    type: redis
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/oneleft}
          jwk-set-uri: ${KEYCLOAK_JWKS:${KEYCLOAK_ISSUER:http://localhost:8180/realms/oneleft}/protocol/openid-connect/certs}

server:
  # Behind the gateway: generated URLs (Location header...) use the public host from X-Forwarded-*
  forward-headers-strategy: framework
  port: ${PORT:8082}

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Histograms to compute latency percentiles (p95, p99) in Prometheus
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: OneLeft · plans

# Weather service (HU-026) and place suggestions (HU-071): each circuit opens after half of the last 10 calls
# failed, and is half-open again after 30 s
resilience4j:
  circuitbreaker:
    instances:
      weather:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      places:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
  timelimiter:
    instances:
      weather:
        timeout-duration: 4s
      places:
        timeout-duration: 4s

oneleft:
  # Whether the plans of someone may be seen (HU-048): the social service decides, asked with the token of the caller
  social:
    url: ${SOCIAL_URL:http://localhost:8085}
  weather:
    url: ${WEATHER_URL:https://api.open-meteo.com}
  places:
    url: ${PLACES_URL:https://photon.komoot.io}
  share:
    # Where a shared link finally opens the plan (the web app) and the time zone of the preview (HU-024)
    web-url: ${WEB_URL:http://localhost:4200}
    zone: ${SHARE_ZONE:Europe/Madrid}
