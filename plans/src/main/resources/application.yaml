spring:
  application:
    name: plans
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/plans}
    username: ${DB_USER:oneleft}
    password: ${DB_PASSWORD:oneleft-dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USER:oneleft}
    password: ${RABBITMQ_PASSWORD:oneleft-dev}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/oneleft}
          jwk-set-uri: ${KEYCLOAK_JWKS:${KEYCLOAK_ISSUER:http://localhost:8180/realms/oneleft}/protocol/openid-connect/certs}

server:
  # Detrás del gateway: las URL generadas (cabecera Location...) usan el host público de X-Forwarded-*
  forward-headers-strategy: framework
  port: ${PORT:8082}

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Histogramas para calcular percentiles de latencia (p95, p99) en Prometheus
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: OneLeft · plans
