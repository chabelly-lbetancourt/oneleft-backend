spring:
  application:
    name: plans

server:
  port: ${PORT:8082}

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Histogramas para calcular percentiles de latencia (p95, p99) en Prometheus
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: OneLeft · plans
