spring:
  application:
    name: social
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/social}
    username: ${DB_USER:oneleft}
    password: ${DB_PASSWORD:oneleft-dev}
  # Events of the plans service that make the activity feed, and its notices (HU-051)
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USER:oneleft}
    password: ${RABBITMQ_PASSWORD:oneleft-dev}
    listener:
      simple:
        # An event that keeps failing is tried three times and then goes to social.dead-letters, instead of
        # coming back forever
        retry:
          enabled: true
          max-attempts: 3
        default-requeue-rejected: false
  # First page of each feed (HU-051). Short timeouts: without Redis the feed is read from the database
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      timeout: 1s
      connect-timeout: 1s
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that it matches
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          # Token issuer (Keycloak realm). The public keys are downloaded from its JWKS.
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/oneleft}
          # Inside Docker the keys are downloaded through the internal network (keycloak:8180),
          # but the token issuer is still the public URL (localhost:8180)
          jwk-set-uri: ${KEYCLOAK_JWKS:${KEYCLOAK_ISSUER:http://localhost:8180/realms/oneleft}/protocol/openid-connect/certs}

server:
  # Behind the gateway: generated URLs use the public host from X-Forwarded-*
  forward-headers-strategy: framework
  port: ${PORT:8085}

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Histograms to compute latency percentiles (p95, p99) in Prometheus
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      # The cache of the feeds is a shortcut: without it the service still works
      enabled: false
  info:
    env:
      enabled: true

info:
  app:
    name: OneLeft · social

oneleft:
  # The name of someone the social service does not know yet: asked once to the users service, with the token of
  # whoever follows them
  users:
    url: ${USERS_URL:http://localhost:8081}
